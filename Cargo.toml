[package]
name = "yanxi-trans-r"
version = "0.5.8"
edition = "2024"
rust-version = "1.85"
authors = ["LeonHerben <herberten16@gmail.com>"]
description = "High-performance, ultra-lightweight selection translation tool in Rust"
license = "MIT"
repository = "https://github.com/LeonHerben/yanxi-trans-r"

[[bin]]
name = "yanxi-cli"
path = "src/main.rs"

[[bin]]
name = "yanxi-gui"
path = "src/bin/yanxi-gui.rs"

[dependencies]
arboard = "3.6.1"
clap = { version = "4.6.7", features = ["derive"] }
colored = "2.1.0"
dirs = "5.0.1"
eframe = { version = "0.36.2", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
regex = "1.11.1"
reqwest = { version = "0.12.12", default-features = false, features = ["json", "rustls-tls", "cookies"] }
rusqlite = { version = "0.33.0", features = ["bundled"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
sha2 = "0.10.8"
tokio = { version = "1.43.0", features = ["full"] }

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.14.0", features = ["all-extensions"] }

[target.'cfg(windows)'.dependencies]
raw-window-handle = "0.6"
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Media_Multimedia",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_DataExchange",
    "Win32_System_Ole",
    "Win32_System_Pipes",
    "Win32_System_Threading",
    "Win32_UI_Accessibility",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

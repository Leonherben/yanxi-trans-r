name: CI & Release

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]

jobs:
  check:
    name: Check & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Cargo Check
        run: cargo check --verbose
      - name: Cargo Test
        run: cargo test --verbose

  build:
    name: Build (${{ matrix.target }})
    needs: check
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2

      - name: Build Release Binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Prepare Artifact (Linux)
        if: runner.os == 'Linux'
        run: |
          strip target/${{ matrix.target }}/release/yanxi-cli
          strip target/${{ matrix.target }}/release/yanxi-gui
          cp target/${{ matrix.target }}/release/yanxi-cli ./yanxi-cli-linux-x86_64
          cp target/${{ matrix.target }}/release/yanxi-gui ./yanxi-gui-linux-x86_64

      - name: Prepare Artifact (Windows)
        if: runner.os == 'Windows'
        run: |
          Copy-Item target/${{ matrix.target }}/release/yanxi-cli.exe ./yanxi-cli-windows-x86_64.exe
          Copy-Item target/${{ matrix.target }}/release/yanxi-gui.exe ./yanxi-gui-windows-x86_64.exe

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        with:
          files: |
            yanxi-cli-*
            yanxi-gui-*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
